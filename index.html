<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contact">
<title>Contact — Send Message</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
  /* ============================================================
     THEME VARIABLES (Dark + Light)
     ============================================================ */
  :root {
    /* DARK THEME (default) */
    --bg-start: #1c1c2e;
    --bg-mid: #0a0a0f;
    --bg-end: #000;
    --card-bg: rgba(28, 28, 32, 0.78);
    --card-border: rgba(255, 255, 255, 0.1);
    --card-shadow: rgba(0, 0, 0, 0.7);
    --text-primary: #fff;
    --text-secondary: rgba(255, 255, 255, 0.55);
    --text-tertiary: rgba(255, 255, 255, 0.4);
    --text-label: rgba(255, 255, 255, 0.75);
    --input-bg: rgba(255, 255, 255, 0.06);
    --input-border: rgba(255, 255, 255, 0.1);
    --input-placeholder: rgba(255, 255, 255, 0.3);
    --input-text: #fff;
    --modal-card: rgba(44, 44, 48, 0.85);
    --modal-border: rgba(255, 255, 255, 0.08);
    --modal-header-bg: rgba(255, 255, 255, 0.03);
    --modal-header-border: rgba(255, 255, 255, 0.1);
    --modal-item-border: rgba(255, 255, 255, 0.08);
    --modal-item-active: rgba(255, 255, 255, 0.08);
    --modal-text-primary: #fff;
    --modal-text-secondary: rgba(255, 255, 255, 0.5);
    --action-blue: #0a84ff;
    --info-bg: rgba(10, 132, 255, 0.08);
    --info-text: rgba(255, 255, 255, 0.7);
    --info-accent: #64d2ff;
    --grid-line: rgba(255, 255, 255, 0.025);
    --orb-opacity: 0.55;
  }

  /* LIGHT THEME */
  html[data-theme="light"] {
    --bg-start: #e8ecf5;
    --bg-mid: #f0f2f8;
    --bg-end: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: rgba(0, 0, 0, 0.08);
    --card-shadow: rgba(0, 0, 0, 0.15);
    --text-primary: #0a0a0f;
    --text-secondary: rgba(0, 0, 0, 0.55);
    --text-tertiary: rgba(0, 0, 0, 0.4);
    --text-label: rgba(0, 0, 0, 0.7);
    --input-bg: rgba(0, 0, 0, 0.04);
    --input-border: rgba(0, 0, 0, 0.08);
    --input-placeholder: rgba(0, 0, 0, 0.35);
    --input-text: #0a0a0f;
    --modal-card: rgba(255, 255, 255, 0.92);
    --modal-border: rgba(0, 0, 0, 0.08);
    --modal-header-bg: rgba(0, 0, 0, 0.02);
    --modal-header-border: rgba(0, 0, 0, 0.08);
    --modal-item-border: rgba(0, 0, 0, 0.06);
    --modal-item-active: rgba(0, 0, 0, 0.05);
    --modal-text-primary: #0a0a0f;
    --modal-text-secondary: rgba(0, 0, 0, 0.5);
    --action-blue: #007aff;
    --info-bg: rgba(0, 122, 255, 0.08);
    --info-text: rgba(0, 0, 0, 0.7);
    --info-accent: #007aff;
    --grid-line: rgba(0, 0, 0, 0.03);
    --orb-opacity: 0.35;
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { min-height: 100vh; overflow-x: hidden; }

  body {
    background: radial-gradient(ellipse at top, var(--bg-start) 0%, var(--bg-mid) 55%, var(--bg-end) 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 15px;
    min-height: 100vh;
    transition: background 0.4s ease;
  }

  /* ============ THEME TOGGLE BUTTON ============ */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 500;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: var(--card-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    color: var(--text-primary);
    font-size: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-toggle:active { transform: scale(0.9); }
  .theme-toggle .icon-sun,
  .theme-toggle .icon-moon {
    position: absolute;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  html[data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
  html[data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0); }

  /* ============ 3D ORBS ============ */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: var(--orb-opacity);
    pointer-events: none;
    z-index: 0;
    animation: float 14s ease-in-out infinite;
    transition: opacity 0.4s ease;
  }
  .orb1 { width: 340px; height: 340px; background: radial-gradient(circle, #0a84ff, #5e5ce6); top: -120px; left: -120px; }
  .orb2 { width: 300px; height: 300px; background: radial-gradient(circle, #25d366, #128c7e); bottom: -110px; right: -110px; animation-delay: 3s; }
  .orb3 { width: 260px; height: 260px; background: radial-gradient(circle, #64d2ff, #0a84ff); top: 45%; right: -100px; animation-delay: 6s; }
  .orb4 { width: 280px; height: 280px; background: radial-gradient(circle, #30d158, #00c7be); bottom: 18%; left: -110px; animation-delay: 9s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -50px) scale(1.1); }
    66% { transform: translate(-30px, 30px) scale(0.95); }
  }

  .grid-overlay {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 1;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    transition: background-image 0.4s ease;
  }

  /* ============ MAIN CARD ============ */
  .container {
    position: relative;
    z-index: 10;
    background: var(--card-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--card-border);
    padding: 36px 28px 30px;
    border-radius: 28px;
    box-shadow:
      0 30px 80px var(--card-shadow),
      0 0 0 0.5px var(--card-border) inset,
      0 1px 0 rgba(255, 255, 255, 0.12) inset;
    width: 100%;
    max-width: 420px;
    animation: cardIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(50px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .header-icon {
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    background: linear-gradient(180deg, #0a84ff 0%, #5e5ce6 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 12px 32px rgba(10, 132, 255, 0.5),
      0 0 0 0.5px rgba(255,255,255,0.15) inset,
      0 1px 0 rgba(255,255,255,0.25) inset;
    animation: iconPulse 3s ease-in-out infinite;
    position: relative;
    overflow: hidden;
  }
  .header-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 55%);
    border-radius: 20px;
  }
  .header-icon svg { width: 38px; height: 38px; z-index: 1; position: relative; }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 12px 32px rgba(10,132,255,0.5); }
    50% { transform: scale(1.05); box-shadow: 0 16px 44px rgba(10,132,255,0.75); }
  }

  h2 {
    text-align: center;
    color: var(--text-primary);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.4px;
    text-shadow: 0 2px 24px rgba(10, 132, 255, 0.4);
    transition: color 0.4s ease;
  }

  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 26px;
    font-weight: 400;
    line-height: 1.5;
    transition: color 0.4s ease;
  }

  .form-group { margin-bottom: 14px; position: relative; }

  label {
    display: block;
    color: var(--text-label);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 7px;
    padding-left: 4px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    transition: color 0.4s ease;
  }

  input, select {
    width: 100%;
    padding: 14px 16px 14px 46px;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 14px;
    font-size: 16px;
    color: var(--input-text);
    transition: all 0.3s ease;
    outline: none;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  input::placeholder { color: var(--input-placeholder); }
  input:focus, select:focus {
    border-color: #0a84ff;
    background: rgba(10, 132, 255, 0.1);
    box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
    transform: translateY(-1px);
  }

  /* Custom dropdown arrow */
  .select-wrapper {
    position: relative;
  }
  .select-wrapper::after {
    content: '';
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 7px;
    height: 7px;
    border-right: 2px solid var(--text-secondary);
    border-bottom: 2px solid var(--text-secondary);
    pointer-events: none;
    transition: 0.3s;
  }

  select {
    cursor: pointer;
    padding-right: 44px;
  }

  select option {
    background: var(--bg-mid);
    color: var(--text-primary);
    padding: 10px;
  }

  .input-icon {
    position: absolute;
    left: 15px; top: 41px;
    font-size: 17px;
    pointer-events: none;
    opacity: 0.8;
    transition: 0.3s;
    z-index: 2;
  }

  button.submit {
    width: 100%;
    padding: 16px;
    background: linear-gradient(180deg, #0a84ff 0%, #0066dd 100%);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    font-family: inherit;
    box-shadow:
      0 12px 32px rgba(10, 132, 255, 0.45),
      0 1px 0 rgba(255,255,255,0.25) inset;
    letter-spacing: 0.2px;
  }
  button.submit::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: 0.7s;
  }
  button.submit:hover::before { left: 100%; }
  button.submit:active { transform: scale(0.97); }

  .autosave-badge {
    position: absolute;
    top: -8px; right: 12px;
    background: rgba(48, 209, 88, 0.15);
    border: 1px solid rgba(48, 209, 88, 0.4);
    color: #30d158;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 8px;
    font-weight: 500;
    letter-spacing: 0.2px;
    opacity: 0;
    transform: translateY(4px);
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .autosave-badge.show {
    opacity: 1;
    transform: translateY(0);
  }

  .info-box {
    margin-top: 20px;
    padding: 13px 15px;
    background: var(--info-bg);
    border-left: 3px solid #0a84ff;
    border-radius: 10px;
    font-size: 12px;
    color: var(--info-text);
    line-height: 1.55;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .info-box strong { color: var(--info-accent); font-weight: 600; }

  .owner-number {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-tertiary);
    transition: color 0.4s ease;
  }
  .owner-number span { font-weight: 700; color: var(--info-accent); }

  /* ============ PWA INSTALL BANNER ============ */
  .pwa-banner {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(200px);
    background: var(--card-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 800;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: calc(100% - 32px);
    width: 420px;
  }
  .pwa-banner.show {
    transform: translateX(-50%) translateY(0);
  }
  .pwa-banner-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(180deg, #0a84ff, #5e5ce6);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
    font-size: 20px;
  }
  .pwa-banner-text {
    flex: 1;
    min-width: 0;
  }
  .pwa-banner-title {
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .pwa-banner-sub {
    color: var(--text-secondary);
    font-size: 11px;
  }
  .pwa-install-btn {
    background: linear-gradient(180deg, #0a84ff, #0066dd);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
    letter-spacing: 0.2px;
  }
  .pwa-install-btn:active { transform: scale(0.95); }
  .pwa-close-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    flex-shrink: 0;
    font-family: inherit;
    line-height: 1;
  }

  /* ============ iOS ACTION SHEET MODAL ============ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
    padding: 0 8px 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    animation: overlayIn 0.3s ease;
  }
  .modal-overlay.active { display: flex; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .action-sheet {
    width: 100%;
    max-width: 480px;
    animation: sheetUp 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
    transform-origin: bottom center;
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .action-card {
    background: var(--modal-card);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 8px;
    border: 0.5px solid var(--modal-border);
    transition: background 0.4s ease;
  }

  .action-header {
    padding: 14px 20px 12px;
    text-align: center;
    border-bottom: 0.5px solid var(--modal-header-border);
    background: var(--modal-header-bg);
  }
  .action-header-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--modal-text-primary);
    letter-spacing: -0.1px;
  }
  .action-header-sub {
    font-size: 11.5px;
    color: var(--modal-text-secondary);
    margin-top: 3px;
  }

  .action-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    cursor: pointer;
    text-decoration: none;
    color: var(--modal-text-primary);
    transition: background 0.15s ease;
    position: relative;
    border-bottom: 0.5px solid var(--modal-item-border);
  }
  .action-item:last-child { border-bottom: none; }
  .action-item:active { background: var(--modal-item-active); }

  .action-item.priority {
    background: rgba(37, 211, 102, 0.08);
  }
  .action-item.priority::before {
    content: 'BEST';
    position: absolute;
    top: 50%;
    right: 60px;
    transform: translateY(-50%);
    background: linear-gradient(135deg, #25d366, #128c7e);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 6px;
    letter-spacing: 0.5px;
    box-shadow: 0 3px 10px rgba(37, 211, 102, 0.4);
  }

  .action-icon {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow:
      0 3px 8px rgba(0,0,0,0.35),
      0 0 0 0.5px rgba(255,255,255,0.12) inset,
      0 1px 0 rgba(255,255,255,0.2) inset;
    position: relative;
    overflow: hidden;
  }
  .action-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 55%);
    border-radius: 11px;
    pointer-events: none;
  }
  .action-icon svg {
    width: 24px;
    height: 24px;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
  }

  .icon-messages  { background: linear-gradient(180deg, #6ee86e 0%, #00c400 100%); }
  .icon-whatsapp  { background: linear-gradient(180deg, #4ce06a 0%, #25d366 55%, #128c7e 100%); }
  .icon-mail      { background: linear-gradient(180deg, #5ac8fa 0%, #0a84ff 100%); }
  .icon-telegram  { background: linear-gradient(180deg, #3fb8ff 0%, #229ed9 100%); }
  .icon-instagram {
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
  }
  .icon-share     { background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 100%); }
  .icon-copy      { background: linear-gradient(180deg, #94a3b8 0%, #475569 100%); }

  .action-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  .action-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--modal-text-primary);
    letter-spacing: -0.2px;
  }
  .action-desc {
    font-size: 12px;
    color: var(--modal-text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .action-arrow {
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--modal-text-secondary);
    border-bottom: 2px solid var(--modal-text-secondary);
    transform: rotate(-45deg);
    flex-shrink: 0;
    margin-right: 4px;
    opacity: 0.5;
  }

  .cancel-action {
    width: 100%;
    background: var(--modal-card);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid var(--modal-border);
    border-radius: 16px;
    padding: 16px;
    color: var(--action-blue);
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: -0.2px;
    transition: background 0.15s ease;
  }
  .cancel-action:active { background: var(--modal-item-active); }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: linear-gradient(135deg, #0a84ff, #5e5ce6);
    color: #fff;
    padding: 12px 20px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 14px 40px rgba(10, 132, 255, 0.5);
    z-index: 2000;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90%;
    text-align: center;
