<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF UID Checker Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 20% 30%, #0f172a, #030712); padding: 1.5rem; }
        .main-container { max-width: 650px; width: 100%; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(69, 243, 255, 0.25); border-radius: 2.5rem; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8); }
        .brand { text-align: center; margin-bottom: 1.5rem; }
        .brand i { font-size: 2.8rem; color: #45f3ff; filter: drop-shadow(0 0 10px #45f3ff66); }
        .brand h2 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #b0faff, #45f3ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 0.3rem; }
        .brand p { color: #94a3b8; font-size: 0.9rem; }
        
        /* ===== Server Status ===== */
        .server-status { text-align: center; padding: 0.3rem; font-size: 0.7rem; color: #22c55e; }
        .server-status.offline { color: #ff4d4d; }
        
        /* ===== Region Buttons ===== */
        .region-select { display: flex; gap: 0.5rem; margin: 0.5rem 0; flex-wrap: wrap; justify-content: center; }
        .region-btn { padding: 0.4rem 0.8rem; background: #0b1120; border: 1px solid #1e293b; border-radius: 20px; color: #94a3b8; cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .region-btn:hover { border-color: #45f3ff; color: #45f3ff; }
        .region-btn.active { border-color: #45f3ff; background: #45f3ff11; color: #45f3ff; }
        
        /* ===== Input ===== */
        .input-wrapper { position: relative; display: flex; align-items: center; background: #0b1120; border-radius: 60px; border: 2px solid #1e293b; transition: 0.3s; margin: 0.8rem 0; }
        .input-wrapper:focus-within { border-color: #45f3ff; box-shadow: 0 0 20px #45f3ff33; }
        .input-wrapper i { position: absolute; left: 18px; color: #64748b; font-size: 1.1rem; }
        .input-wrapper input { width: 100%; padding: 1rem 1rem 1rem 3.2rem; background: transparent; border: none; outline: none; color: #f1f5f9; font-size: 1rem; font-weight: 500; }
        .input-wrapper input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .input-wrapper input[type="number"] { -moz-appearance: textfield; }
        
        /* ===== Buttons ===== */
        .btn-primary { width: 100%; padding: 1rem; background: linear-gradient(145deg, #45f3ff, #0bd1e0); border: none; border-radius: 60px; font-weight: 700; font-size: 1.1rem; color: #0b1120; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: 0.25s; box-shadow: 0 8px 18px -6px #45f3ff55; margin-top: 0.5rem; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 10px 28px -6px #45f3ffaa; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        /* ===== Loading ===== */
        .loading-box { display: none; text-align: center; padding: 1.5rem; color: #facc15; }
        .loading-box i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ===== Error ===== */
        .error-box { display: none; text-align: center; padding: 1rem; color: #ff7b7b; background: #ff4d4d22; border-radius: 1rem; border: 1px solid #ff4d4d55; margin-top: 0.5rem; }
        
        /* ===== Result ===== */
        .result-box { display: none; margin-top: 1.5rem; background: #0b1120; border-radius: 1.2rem; padding: 1.5rem; border: 1px solid #1e293b; animation: fadeSlide 0.4s ease; }
        .result-box.show { display: block; }
        @keyframes fadeSlide { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .result-header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .result-header i { color: #45f3ff; font-size: 1.5rem; }
        .result-header h3 { color: #e2e8f0; font-weight: 600; }
        .result-header h3 span { color: #45f3ff; }
        
        /* ===== Info Grid ===== */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .info-item { background: #0b1120; padding: 0.8rem; border-radius: 0.8rem; border: 1px solid #1e293b; }
        .info-item .label { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item .value { color: #f8fafc; font-weight: 600; font-size: 1rem; margin-top: 0.2rem; word-break: break-word; }
        .info-item.full { grid-column: 1 / -1; }
        .badge { display: inline-block; background: #45f3ff22; color: #45f3ff; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.65rem; border: 1px solid #45f3ff44; margin-left: 8px; }
        
        /* ===== Debug ===== */
        .debug-box { display: none; margin-top: 1rem; background: #0b1120; border-radius: 0.8rem; padding: 1rem; border: 1px solid #facc1544; font-size: 0.7rem; color: #94a3b8; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: monospace; }
        .debug-box.show { display: block; }
        
        /* ===== Footer ===== */
        .footer { text-align: center; color: #475569; font-size: 0.7rem; padding-top: 1rem; border-top: 1px solid #1e293b60; margin-top: 1rem; }
        .footer i { color: #45f3ff; }
        
        @media (max-width: 480px) { .glass-card { padding: 1.5rem; } .info-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="glass-card">
        <!-- ===== Brand ===== -->
        <div class="brand">
            <i class="fas fa-crosshairs"></i>
            <h2>FF UID Checker</h2>
            <p>Real-time Free Fire Player Verification</p>
        </div>

        <!-- ===== Server Status ===== -->
        <div id="serverStatus" class="server-status">
            <i class="fas fa-circle"></i> Connecting...
        </div>

        <!-- ===== Region Selector ===== -->
        <div style="text-align: center; margin: 0.5rem 0;">
            <p style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 0.3rem;">Select Region:</p>
            <div class="region-select">
                <button class="region-btn active" data-region="IND" onclick="selectRegion(this)">🇮🇳 IND</button>
                <button class="region-btn" data-region="BD" onclick="selectRegion(this)">🇧🇩 BD</button>
                <button class="region-btn" data-region="ID" onclick="selectRegion(this)">🇮🇩 ID</button>
                <button class="region-btn" data-region="SG" onclick="selectRegion(this)">🇸🇬 SG</button>
                <button class="region-btn" data-region="PK" onclick="selectRegion(this)">🇵🇰 PK</button>
                <button class="region-btn" data-region="BR" onclick="selectRegion(this)">🇧🇷 BR</button>
            </div>
        </div>

        <!-- ===== Input ===== -->
        <div class="input-wrapper">
            <i class="fas fa-id-card"></i>
            <input type="number" id="uidInput" placeholder="Enter UID (e.g. 1633864660)" value="1633864660">
        </div>
        
        <button class="btn-primary" id="checkBtn" onclick="checkPlayer()">
            <i class="fas fa-search"></i> Verify Player
        </button>

        <!-- ===== Loading ===== -->
        <div id="loadingBox" class="loading-box">
            <i class="fas fa-spinner"></i><br>
            Fetching player details...
        </div>
        
        <!-- ===== Error ===== -->
        <div id="errorBox" class="error-box">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">Error</span>
        </div>

        <!-- ===== Debug ===== -->
        <div id="debugBox" class="debug-box"></div>

        <!-- ===== Result ===== -->
        <div id="resultBox" class="result-box">
            <div class="result-header">
                <i class="fas fa-user-check"></i>
                <h3>Player <span>Found</span> <span id="sourceBadge" class="badge"></span></h3>
            </div>
            <div class="info-grid">
                <div class="info-item full">
                    <div class="label"><i class="fas fa-user"></i> Nickname</div>
                    <div class="value" id="pName">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-fingerprint"></i> UID</div>
                    <div class="value" id="pId">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-chart-simple"></i> Level</div>
                    <div class="value" id="pLevel">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-globe-asia"></i> Region</div>
                    <div class="value" id="pRegion">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-heart" style="color: #ff6b9d;"></i> Likes</div>
                    <div class="value" id="pLikes">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-trophy"></i> BR Rank</div>
                    <div class="value" id="pBrRank">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-trophy"></i> CS Rank</div>
                    <div class="value" id="pCsRank">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-users"></i> Guild</div>
                    <div class="value" id="pGuild">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-venus-mars"></i> Gender</div>
                    <div class="value" id="pGender">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-calendar"></i> Created</div>
                    <div class="value" id="pCreated">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-clock"></i> Last Login</div>
                    <div class="value" id="pLastLogin">—</div>
                </div>
                <div class="info-item">
                    <div class="label"><i class="fas fa-star"></i> EXP</div>
                    <div class="value" id="pExp">—</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt"></i> Secure · Powered by Render
        </div>
    </div>
</div>

<script>
    // ============================================
    // 🔥 PUBLIC SERVER URL - YAHAN APNA URL DAALEIN
    // ============================================
    const SERVER_URL = 'https://ff-uid-checker.onrender.com'; // ← YAHAN CHANGE KAREIN

    // ============================================
    // STATE
    // ============================================
    let selectedRegion = 'IND';
    let serverReady = false;

    // ============================================
    // DOM REFS
    // ============================================
    const uidInput = document.getElementById('uidInput');
    const checkBtn = document.getElementById('checkBtn');
    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const resultBox = document.getElementById('resultBox');
    const debugBox = document.getElementById('debugBox');
    const sourceBadge = document.getElementById('sourceBadge');
    const serverStatus = document.getElementById('serverStatus');

    const pName = document.getElementById('pName');
    const pId = document.getElementById('pId');
    const pLevel = document.getElementById('pLevel');
    const pRegion = document.getElementById('pRegion');
    const pLikes = document.getElementById('pLikes');
    const pBrRank = document.getElementById('pBrRank');
    const pCsRank = document.getElementById('pCsRank');
    const pGuild = document.getElementById('pGuild');
    const pGender = document.getElementById('pGender');
    const pCreated = document.getElementById('pCreated');
    const pLastLogin = document.getElementById('pLastLogin');
    const pExp = document.getElementById('pExp');

    // ============================================
    // REGION SELECT
    // ============================================
    function selectRegion(el) {
        document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        selectedRegion = el.dataset.region;
        debugLog('📍 Region changed:', selectedRegion);
    }

    // ============================================
    // HELPERS
    // ============================================
    function debugLog(msg, data) {
        debugBox.classList.add('show');
        const timestamp = new Date().toLocaleTimeString();
        let logMsg = `[${timestamp}] ${msg}\n`;
        if (data) {
            logMsg += typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
            logMsg += '\n';
        }
        logMsg += '─'.repeat(40) + '\n';
        debugBox.textContent += logMsg;
        debugBox.scrollTop = debugBox.scrollHeight;
        console.log(msg, data || '');
    }

    function formatNumber(num) {
        if (num === undefined || num === null) return '—';
        if (typeof num === 'number') return num.toLocaleString();
        return num;
    }

    function formatDate(timestamp) {
        if (!timestamp) return '—';
        try {
            const date = new Date(parseInt(timestamp) * 1000);
            if (isNaN(date.getTime())) return '—';
            return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        } catch {
            return '—';
        }
    }

    function getGender(genderStr) {
        if (!genderStr) return '—';
        if (genderStr === 'Gender_MALE' || genderStr === 'MALE') return '👦 Male';
        if (genderStr === 'Gender_FEMALE' || genderStr === 'FEMALE') return '👧 Female';
        return genderStr;
    }

    function getRankName(rankId) {
        const ranks = {
            300: 'Bronze', 301: 'Bronze I', 302: 'Bronze II', 303: 'Bronze III',
            304: 'Silver', 305: 'Silver I', 306: 'Silver II', 307: 'Silver III',
            308: 'Gold', 309: 'Gold I', 310: 'Gold II', 311: 'Gold III',
            312: 'Platinum', 313: 'Platinum I', 314: 'Platinum II', 315: 'Platinum III',
            316: 'Diamond', 317: 'Diamond I', 318: 'Diamond II', 319: 'Diamond III',
            320: 'Heroic', 321: 'Heroic I', 322: 'Heroic II', 323: 'Grandmaster'
        };
        return ranks[rankId] || (rankId ? `Rank ${rankId}` : '—');
    }

    // ============================================
    // CHECK SERVER
    // ============================================
    async function checkServer() {
        try {
            const response = await fetch(`${SERVER_URL}/api/regions`, {
                signal: AbortSignal.timeout(5000)
            });
            if (response.ok) {
                serverStatus.innerHTML = '<i class="fas fa-circle" style="color:#22c55e;"></i> Server Online ✅';
                serverStatus.className = 'server-status';
                serverReady = true;
                debugLog('✅ Server connected:', SERVER_URL);
                return true;
            }
        } catch (e) {
            serverStatus.innerHTML = `<i class="fas fa-circle" style="color:#ff4d4d;"></i> Server Offline - ${SERVER_URL}`;
            serverStatus.className = 'server-status offline';
            serverReady = false;
            debugLog('❌ Server not running:', SERVER_URL);
            return false;
        }
    }

    // ============================================
    // MAIN CHECK FUNCTION
    // ============================================
    async function checkPlayer() {
        const uid = uidInput.value.trim();
        const region = selectedRegion;
        
        // Reset UI
        loadingBox.style.display = 'none';
        errorBox.style.display = 'none';
        resultBox.classList.remove('show');
        debugBox.textContent = '';
        debugBox.classList.remove('show');
        checkBtn.disabled = true;
        checkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

        // Check server first
        if (!serverReady) {
            await checkServer();
            if (!serverReady) {
                errorText.innerText = `⚠️ Server not running. Please check ${SERVER_URL}`;
                errorBox.style.display = 'block';
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-search"></i> Verify Player';
                return;
            }
        }

        // Validate
        if (!uid) {
            errorText.innerText = 'Please enter a valid Free Fire UID.';
            errorBox.style.display = 'block';
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-search"></i> Verify Player';
            return;
        }

        if (!/^\d{6,15}$/.test(uid)) {
            errorText.innerText = 'Invalid UID format. Enter a valid numeric UID (6-15 digits).';
            errorBox.style.display = 'block';
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-search"></i> Verify Player';
            return;
        }

        loadingBox.style.display = 'block';
        debugLog('🚀 Starting verification');
        debugLog('📌 UID:', uid);
        debugLog('📍 Region:', region);
        debugLog('🔗 Server:', SERVER_URL);

        try {
            const response = await fetch(
                `${SERVER_URL}/api/player?uid=${uid}&region=${region}`,
                { signal: AbortSignal.timeout(20000) }
            );
            
            debugLog(`📡 Server Status: ${response.status}`);
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Server error: ${response.status}`);
            }

            const result = await response.json();
            debugLog('📦 Response:', result);
            
            if (result.success) {
                const d = result.data;
                
                // Fill all fields
                pName.innerText = d.nickname || '—';
                pId.innerText = d.accountId || uid;
                pLevel.innerText = d.level || '—';
                pRegion.innerText = d.region || region;
                pLikes.innerText = formatNumber(d.likes);
                pBrRank.innerText = getRankName(d.brRank);
                pCsRank.innerText = getRankName(d.csRank);
                pGuild.innerText = d.guild || 'No Guild';
                pGender.innerText = getGender(d.gender);
                pCreated.innerText = formatDate(d.created);
                pLastLogin.innerText = formatDate(d.lastLogin);
                pExp.innerText = formatNumber(d.exp);
                
                sourceBadge.textContent = '✓ ' + (r
